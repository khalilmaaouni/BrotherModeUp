# Runs the BrotherMode regression tests on every push and pull request. A failing
# test exits nonzero and fails the check, so the mechanisms the project claims
# (secret redaction, owner-only sensitive files, no project-identity collision,
# non-invasive autosave) are enforced at merge time, not merely asserted in prose.
#
# Two jobs on purpose. The legacy V1 suite still contains platform assumptions
# (shell scripts, POSIX file modes), so it runs where those hold: Linux and macOS.
# The V2 engine is cross-platform from birth, so its suite runs on all three
# platforms including Windows, on the oldest supported Python and the newest.
# Actions are pinned to full commit SHAs (verified 2026-07-26 against the GitHub
# API) so a moved tag cannot change what runs here.
#
# Every checkout below sets fetch-depth: 0, and that is load-bearing rather than
# habit (2026-08-02). actions/checkout defaults to a depth of one commit and
# fetches NO TAGS, so `git tag` returns nothing here. The release-truth suite
# asserts that the tag the install documentation pins actually resolves, which is
# the check that stands between a reader and a copied clone command that fails.
# With no tags fetched that assertion could only ever fail, and it did, on every
# run of release/2.0-final from the day the branch was cut: the guard against a
# broken install pin was itself broken, in the one place it was supposed to run.
name: tests
permissions:
  contents: read
on:
  push:
    # `release/**` rather than a bare branch name (2026-08-03): the list used to
    # name `v2`, which matches no branch here and has not for a long time, so
    # release branches got no push-triggered run at all and were covered only by
    # the pull-request trigger. That is how three red runs sat unnoticed on a
    # release branch while local gates read green.
    branches: [ main, "release/**" ]
  pull_request:
jobs:
  suite:
    strategy:
      # fail-fast disabled deliberately (audit finding 14, 2026-07-27). With it on,
      # the first failing leg CANCELS the others, so a Windows failure erased the
      # evidence from every remaining platform and left their real status unknown.
      # A matrix exists to produce evidence per platform; cancelling it defeats the
      # only reason to run one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Both ends of the supported range, not just the newest (2026-08-03).
        # pyproject declares >=3.9 and scripts/install.py refuses below (3, 9),
        # but only three of the twelve suites had ever executed under 3.9: this
        # job pinned "3.x" and ran the other nine there alone. A floor nothing
        # tests is a claim, not a guarantee. The store job below already proved
        # this exact two-value pattern works here.
        python: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # tags must exist here; see the header note
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git (autosave test needs an identity)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - name: Run tests
        run: python3 tools/test_bm.py
      - name: Score checks (strict)
        # Pinned to one leg of the new python axis as well as one OS: this is a
        # telemetry scorecard, not a suite, and it is not version sensitive, so
        # without the second clause it would run twice per push for no gain.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.x'
        run: python3 tools/bm_score.py --strict
      # Audit finding 14 (2026-07-27): the recovery suite was NOT in CI, even though
      # autosave makes the strongest claim this project makes ("your work is safe").
      # The component with the highest cost of being wrong had the least coverage.
      - name: Run the recovery suite
        run: python3 tools/test_bm_autosave.py
      # Loop 9 (2026-07-29): the fence hook suite was in the LOCAL gate and in no
      # CI job at all, so the gate that stands in front of every founder edit was
      # tested on one machine. POSIX only for now: the suite has deliberate
      # win32 skips, but it has never been run on Windows, so claiming that leg
      # would be claiming evidence that does not exist. Named in
      # docs/KNOWN-LIMITS.md rather than left silent.
      - name: Run the fence hook suite
        run: python3 tools/test_bm_fence_hook.py
      # Release cut, 2026-07-29: two suites arrived in the local gate on the
      # install lane with no CI step of their own, which is exactly the
      # asymmetry the gate's inventory check refuses to run with. POSIX legs
      # only: the installer refuses Windows by design (two of the five hook
      # commands are POSIX shell), so a Windows leg would exercise that refusal
      # and nothing else, and the refusal is already covered inside the suite.
      - name: Run the documentation consistency suite
        run: python3 tools/test_bm_docs.py
      - name: Run the installer suite
        run: python3 tools/test_install.py
      - name: Run the cross-runtime adapter suite
        run: python3 tools/test_bm_runtimes.py
      # The loop estimate ledger, landed 2026-07-31. Stdlib only and
      # filesystem only, so it has no platform constraint; it runs on the POSIX
      # legs alongside the other suites that arrived the same way.
      - name: Run the loop estimate ledger suite
        run: python3 tools/test_bm_ledger.py
      # The canonical schema suite, landed 2026-07-31. Stdlib only and
      # filesystem only, same posture as the ledger suite above.
      - name: Run the canonical schema suite
        run: python3 tools/test_bm_schema.py
      # The Memory Sentinel suite, landed 2026-08-02 (Full-Auto Phase 1): the
      # schema 13 tables, the Store methods over them, and the deterministic
      # silence-biased selector. Stdlib only and filesystem only, same posture
      # as the two suites above.
      - name: Run the memory sentinel suite
        run: python3 tools/test_bm_sentinel.py
      # The consent gate suite, landed 2026-08-01 (Loop 3): proves the hooks
      # write nothing before setup consent exists.
      - name: Run the consent gate suite
        run: python3 tools/test_bm_consent.py
      # The Bash-write detection suite, landed 2026-08-01 (Loop 6): the
      # hook that reports the cross-fence write the fence hook cannot block.
      - name: Run the bash audit suite
        run: python3 tools/test_bm_bash_audit.py
      # The packaging install suite, landed 2026-08-04 (C-06): builds a real
      # wheel, installs it into a throwaway virtualenv, and invokes every
      # declared console script, which is the register's own adversarial test
      # for C-06 made executable. UNLIKE every suite above it, this one needs
      # network egress once for pip, and it SKIPs rather than fails when pip
      # cannot reach an index, so an offline runner reports a skip instead of
      # a red build. It is the slowest step in this job by a wide margin and
      # that is inherent: nothing short of a real install proves a packaged
      # install works.
      - name: Run the packaging install suite
        run: python3 tools/test_bm_packaging_install.py
      # The plugin path install suite, landed 2026-08-04 (N-3 / B-3): drives
      # the real claude CLI through marketplace add, install, list, details,
      # uninstall and marketplace remove, against a throwaway copy of the
      # tree and a throwaway HOME. The claude binary is not present on a
      # GitHub runner, so its class B and class C skip here; its class A
      # needs no binary at all and runs on every leg, which keeps this step
      # green and above zero tests on every platform in this matrix.
      - name: Run the plugin install suite
        run: python3 tools/test_bm_plugin_install.py
  # One serial job that runs the SAME command a loop close runs locally
  # (Loop 9 task 2, answered yes). The split jobs above exist for per-platform
  # evidence and cannot be replaced by this one; this one exists because the
  # local gate's own refusals (an unlisted suite, a suite CI never runs, a suite
  # that exits 0 having run nothing) are code in tools/test_all.py, and code that
  # CI never executes is not a gate CI shares. Running it here makes the local and
  # CI meta-checks literally the same check.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # tags must exist here; see the header note
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Configure git (the recovery suite commits to a throwaway repo)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      # The artifact directory is under the runner temp dir, NOT in the checkout:
      # several suites assert things about this repository's own working tree, and
      # a log dropped inside it would be the runner inventing test failures.
      - name: Run the full serial gate
        run: python3 tools/test_all.py --artifacts "$RUNNER_TEMP/bm-test-output" --timeout 1200
      # A red CI leg whose only evidence is a truncated log pane is a leg you
      # debug by re-running it. The full per-suite output is kept instead.
      - name: Keep the full test output when the gate fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-test-output
          path: ${{ runner.temp }}/bm-test-output/
          if-no-files-found: warn
          retention-days: 14
  store:
    strategy:
      # See the note on the suite job above: a cancelled leg is a leg with no evidence.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # tags must exist here; see the header note
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git (the recovery suite commits to a throwaway repo)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      # Wrapped since 2026-07-31 (Loop 6). The Windows legs had been failing on
      # every run for days while the local gate was green, and naming the failing
      # test needed an authenticated log download that credentials policy here
      # makes impossible for the machine that could fix it. A red CI whose reason
      # nobody can read is barely better than no CI.
      # run_with_annotations.py re-emits unittest FAIL/ERROR headers as GitHub
      # annotations, which a PUBLIC repository serves to an anonymous caller, so
      # the next red run names its own failing tests without any login. It
      # forwards the child's exit code and output unchanged and is never a gate.
      - name: Run V2 store tests
        run: python .github/run_with_annotations.py tools/test_bm_store.py
      # The project-lifecycle CLI suite includes the Loop 2 gate: a scripted
      # first project driven end to end through the seven command surfaces.
      - name: Run the project CLI suite
        run: python .github/run_with_annotations.py tools/test_bm_project.py
      # The autonomy contract CLI suite (U1, loop L02, 2026-08-05): same
      # subprocess-driven shape as the project CLI suite above, over the
      # schema 14 tables the V2 store suite already proved sound on this
      # leg, so it runs cross-platform here rather than in the POSIX-only
      # suite job.
      - name: Run the autonomy contract CLI suite
        run: python .github/run_with_annotations.py tools/test_bm_autonomy.py
      # The durable Full-Auto controller suite (U2, loop L03, 2026-08-05):
      # the engine's own fault tests run in process against the schema 15
      # tables the V2 store suite above already proved sound, and the CLI
      # section drives tools/bm_controller.py as a real subprocess, the
      # same cross-platform-safe shape the autonomy contract CLI suite
      # just above already runs on this leg.
      - name: Run the controller suite
        run: python .github/run_with_annotations.py tools/test_bm_controller.py
      # The lead surface suite (L04, 2026-08-05): founder mode, IC mode, the
      # record of what was decided, the half hour catch-up, the handback and
      # the handover pages, over the schema 16 tables the V2 store suite on
      # this same leg already proved sound. It runs here rather than in the
      # POSIX-only suite job for the same reason the two suites above do:
      # it drives its own module in process and as a local subprocess, with
      # no shell script and no platform-specific path handling of its own.
      - name: Run the lead surface suite
        run: python .github/run_with_annotations.py tools/test_bm_lead.py
      # The recovery suite runs on Windows too, not only on the POSIX legs above.
      # Recovery is the subsystem whose failure loses work rather than merely
      # reporting it wrongly, so it gets the widest platform coverage, not the
      # narrowest.
      - name: Run the recovery suite
        run: python .github/run_with_annotations.py tools/test_bm_autosave.py
