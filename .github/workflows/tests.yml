# Runs the BrotherMode regression tests on every push and pull request. A failing
# test exits nonzero and fails the check, so the mechanisms the project claims
# (secret redaction, owner-only sensitive files, no project-identity collision,
# non-invasive autosave) are enforced at merge time, not merely asserted in prose.
#
# Two jobs on purpose. The legacy V1 suite still contains platform assumptions
# (shell scripts, POSIX file modes), so it runs where those hold: Linux and macOS.
# The V2 engine is cross-platform from birth, so its suite runs on all three
# platforms including Windows, on the oldest supported Python and the newest.
# Actions are pinned to full commit SHAs (verified 2026-07-26 against the GitHub
# API) so a moved tag cannot change what runs here.
name: tests
permissions:
  contents: read
on:
  push:
    branches: [ main, v2 ]
  pull_request:
jobs:
  suite:
    strategy:
      # fail-fast disabled deliberately (audit finding 14, 2026-07-27). With it on,
      # the first failing leg CANCELS the others, so a Windows failure erased the
      # evidence from every remaining platform and left their real status unknown.
      # A matrix exists to produce evidence per platform; cancelling it defeats the
      # only reason to run one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Configure git (autosave test needs an identity)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - name: Run tests
        run: python3 tools/test_bm.py
      - name: Score checks (strict)
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/bm_score.py --strict
      # Audit finding 14 (2026-07-27): the recovery suite was NOT in CI, even though
      # autosave makes the strongest claim this project makes ("your work is safe").
      # The component with the highest cost of being wrong had the least coverage.
      - name: Run the recovery suite
        run: python3 tools/test_bm_autosave.py
  store:
    strategy:
      # See the note on the suite job above: a cancelled leg is a leg with no evidence.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git (the recovery suite commits to a throwaway repo)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - name: Run V2 store tests
        run: python tools/test_bm_store.py
      # The recovery suite runs on Windows too, not only on the POSIX legs above.
      # Recovery is the subsystem whose failure loses work rather than merely
      # reporting it wrongly, so it gets the widest platform coverage, not the
      # narrowest.
      - name: Run the recovery suite
        run: python tools/test_bm_autosave.py
